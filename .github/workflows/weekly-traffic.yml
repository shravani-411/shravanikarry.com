name: Weekly traffic report

on:
  schedule:
    - cron: "0 14 * * 1" # Mondays 14:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  id-token: write # keyless Google login via GitHub OIDC

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: auth
        name: Sign in to Google (no key)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/analytics.readonly
      - name: Build report
        env:
          GA_PROPERTY_ID: ${{ vars.GA_PROPERTY_ID }}
          GA_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: node scripts/weekly-traffic.mjs > report.md
      - name: Post report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          gh label create traffic-report --color 0E8A16 --description "Weekly GA4 report" 2>/dev/null || true
          gh issue create --title "Traffic report: week ending $(date -u -d yesterday +%Y-%m-%d)" --body-file report.md --label traffic-report
